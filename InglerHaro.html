<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación - Ingler Haro</title>
    <style>
        /* Restablecimiento básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo de la pantalla para visualización web */
        body {
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Dimensiones exactas de la tarjeta (85.6 x 54 mm) */
        .card {
            width: 85.6mm;
            height: 54mm;
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 8px; /* Bordes redondeados para la pantalla */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* Barra de acento industrial (Naranja de seguridad) */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4mm;
            height: 100%;
            background-color: #f97316;
        }

        /* ========================
           DISEÑO DEL ANVERSO (FRENTE)
           ======================== */
        .front {
            display: flex;
            padding: 5mm 5mm 5mm 9mm; /* 9mm a la izq para saltar la barra naranja */
        }

        .left-col {
            flex: 0 0 25mm;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code {
            width: 25mm;
            height: 25mm;
            image-rendering: crisp-edges;
        }

        .right-col {
            flex: 1;
            padding-left: 5mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name {
            font-size: 13.5pt;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .title {
            font-size: 7.5pt;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .services {
            list-style: none;
            font-size: 6.5pt;
            color: #cbd5e1;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .services li::before {
            content: "▪";
            color: #f97316;
            margin-right: 4px;
        }

        .contact {
            font-size: 7.5pt;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: auto;
            color: #e2e8f0;
        }

        .contact svg {
            color: #25D366; /* Verde de WhatsApp */
        }

        /* ========================
           DISEÑO DEL REVERSO (ATRÁS)
           ======================== */
        .back {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Modificamos el acento para el reverso (barra inferior) */
        .back::before {
            display: none; 
        }
        .back::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3mm;
            background-color: #f97316;
        }

        .tool-icon {
            width: 18mm;
            height: 18mm;
            color: #f97316;
            margin-bottom: 5px;
        }

        .back .name {
            font-size: 15pt;
            margin-bottom: 2px;
        }

        .back .title {
            font-size: 8.5pt;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* ========================
           AJUSTES PARA IMPRESIÓN EXACTA
           ======================== */
        @media print {
            @page {
                margin: 0; 
                size: A4 portrait;
            }
            body {
                background: none;
                padding: 15mm; /* Margen de la hoja impresa */
                gap: 5mm;      /* Separación entre el anverso y el reverso en el papel */
                justify-content: flex-start;
                align-items: flex-start;
            }
            .card {
                box-shadow: none;        /* Quitamos las sombras */
                border-radius: 0;        /* Quitamos los bordes redondeados */
                border: 0.5px dashed #999; /* Guía de corte perimetral para la tijera/guillotina */
                page-break-inside: avoid;
                /* Forzar al navegador a imprimir los colores de fondo oscuros */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <!-- TARJETA - CARA ANVERSO -->
    <div class="card front">
        <div class="left-col">
            <!-- QR a tu web, fondo del mismo color que la tarjeta #1a1a1a, sin margen -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://livebibleis-afk.github.io/PAGES/InglerHaro.html&color=ffffff&bgcolor=1a1a1a&margin=0" alt="QR Code" class="qr-code">
        </div>
        <div class="right-col">
            <h1 class="name">Ingler Haro</h1>
            <h2 class="title">Servicios Generales</h2>
            <ul class="services">
                <li>Albañilería confinada</li>
                <li>Enchapes, mayólica y porcelanato</li>
                <li>Tarrajeos</li>
                <li>Gasfitería</li>
                <li>Soldadura</li>
            </ul>
            <div class="contact">
                <!-- Icono de WhatsApp en SVG -->
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                </svg>
                +51 971 301 167
            </div>
        </div>
    </div>

    <!-- TARJETA - CARA REVERSO -->
    <div class="card back">
        <!-- Icono de herramientas (Martillo y llave cruzados) en SVG -->
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
        <h1 class="name">Ingler Haro</h1>
        <h2 class="title">Servicios Generales</h2>
    </div>

</body>
</html>
