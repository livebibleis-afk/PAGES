<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación - Ingler Haro</title>
    <!-- Fuente Inter para un estilo moderno y minimalista -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dimensiones exactas de tarjeta de crédito / presentación estándar ISO 7810 ID-1 */
            --card-width: 85.6mm;
            --card-height: 54mm;
            
            /* Paleta de colores profesionales (Dark Blue / Slate) */
            --bg-dark: #0f172a;      /* Slate 900 */
            --bg-light: #1e293b;     /* Slate 800 */
            --text-main: #f8fafc;    /* Slate 50 */
            --text-muted: #94a3b8;   /* Slate 400 */
            --whatsapp-green: #25D366;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0; /* Fondo del navegador */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Permite una mejor visualización en pantallas pequeñas antes de imprimir */
            padding: 20px; 
            box-sizing: border-box;
        }

        /* Contenedor principal de la tarjeta */
        .business-card {
            width: var(--card-width);
            height: var(--card-height);
            background: linear-gradient(135deg, var(--bg-light), var(--bg-dark));
            border-radius: 3.18mm; /* Radio de esquina estándar de tarjeta de crédito */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 5mm 6mm;
            box-sizing: border-box;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            /* Fuerza a los navegadores a imprimir el fondo de color */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Patrón sutil de fondo para textura */
        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(255,255,255,0.05) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(255,255,255,0.03) 0%, transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        /* Envoltura interna para alinear Z-index por encima del fondo */
        .card-content {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            gap: 5mm;
            z-index: 2;
        }

        /* Sección Izquierda: Código QR */
        .qr-section {
            flex-shrink: 0;
            width: 32mm;
            height: 32mm;
            background-color: white;
            padding: 1.5mm;
            border-radius: 1.5mm;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .qr-section img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Sección Derecha: Información */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .name {
            font-size: 16pt;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 7.5pt;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .divider {
            height: 2px;
            width: 25px;
            background-color: var(--whatsapp-green);
            margin-bottom: 8px;
            border-radius: 1px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            font-size: 9pt;
            font-weight: 400;
            margin-top: 2px;
        }

        .contact-row svg {
            width: 12px;
            height: 12px;
            fill: var(--whatsapp-green);
            flex-shrink: 0;
        }

        .contact-row span {
            /* Evita que el número se parta en dos líneas */
            white-space: nowrap; 
        }

        /* =========================================================
           Estilos de Impresión (@media print)
           ========================================================= */
        @media print {
            @page {
                size: auto;   /* El tamaño del papel queda a decisión del usuario */
                margin: 0mm;  /* Sin márgenes de navegador predeterminados */
            }

            body {
                background-color: white;
                /* Alinea la tarjeta en la esquina superior izquierda para facilitar el recorte físico */
                align-items: flex-start;
                justify-content: flex-start;
                padding: 10mm; /* Un pequeño margen desde el borde de la página */
            }

            .business-card {
                /* Elimina la sombra 3D en el papel */
                box-shadow: none; 
                /* Se puede agregar un borde gris sutil si la cortas a mano sobre papel blanco */
                /* border: 0.5mm solid #ccc; */
            }
        }
    </style>
</head>
<body>

    <!-- Contenedor de la Tarjeta de Presentación -->
    <div class="business-card">
        <div class="card-content">
            
            <!-- Lado Izquierdo: QR -->
            <div class="qr-section">
                <!-- Código QR que redirige directamente a WhatsApp -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/51971301167" alt="QR WhatsApp">
            </div>
            
            <!-- Lado Derecho: Datos -->
            <div class="info-section">
                <h1 class="name">Ingler Haro</h1>
                <!-- Opcional: Puedes descomentar esto y cambiarlo por tu cargo si lo deseas -->
                <!-- <div class="subtitle">Desarrollador</div> -->
                
                <div class="divider"></div>
                
                <div class="contact-row">
                    <!-- Icono SVG de WhatsApp -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">

                    <span>+51 971 301 167</span>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
