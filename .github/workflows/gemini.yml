name: Gemini CLI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Analizar repositorio con Gemini y responder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          // 1. Obtener lista de archivos y contenido clave del repositorio
          const files = execSync("git ls-files").toString().trim();
          let context = "Archivos del repositorio:\n" + files + "\n\n";

          const keyFiles = ["package.json", "requirements.txt", "README.md", "index.html", "main.js", "app.js", "script.js"];
          for (const f of files.split("\n")) {
            if (keyFiles.some(k => f.endsWith(k)) || f.endsWith(".json") || f.endsWith(".html") || f.endsWith(".js") || f.endsWith(".py")) {
              try {
                const content = fs.readFileSync(f, "utf8").slice(0, 6000);
                context += `\n--- Archivo: ${f} ---\n${content}\n`;
              } catch (e) {}
            }
          }

          // 2. Llamar directamente a Gemini API sin bloqueos interactivos
          async function run() {
            const promptText = `Eres el asistente técnico del repositorio. Responde en español a la siguiente instrucción del usuario basándote en el código del proyecto:\n\nInstrucción: ${process.env.USER_PROMPT}\n\n${context.slice(0, 35000)}`;
            
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });

            const data = await res.json();
            if (!res.ok) {
              console.error("Error de API:", JSON.stringify(data));
              process.exit(1);
            }

            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se pudo generar una respuesta.";
            fs.writeFileSync("respuesta.txt", reply);
          }

          run();
          '
          gh issue comment "$ISSUE_NUMBER" --body-file respuesta.txt
