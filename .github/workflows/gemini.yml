name: Gemini CLI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GEMINI_CLI_TRUST_WORKSPACE: "true"

jobs:
  gemini:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Gemini CLI y responder en el Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          USER_PROMPT: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          npm install -g @google/gemini-cli
          mkdir -p ~/.gemini
          echo '{"trustedFolders": ["'"$GITHUB_WORKSPACE"'", "/home/runner/work"]}' > ~/.gemini/trusted_folders.json
          gemini --yolo -p "$USER_PROMPT" > respuesta.txt
          gh issue comment "$ISSUE_NUMBER" --body-file respuesta.txt
