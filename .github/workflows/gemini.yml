name: Gemini CLI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar, editar archivos y responder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'EOF' > agente.mjs
          import fs from "fs";
          import path from "path";
          import { execSync } from "child_process";

          async function main() {
            try {
              const apiKey = (process.env.GEMINI_API_KEY || "").trim();
              if (!apiKey) {
                fs.writeFileSync("respuesta.txt", "⚠️ Error: El secret `GEMINI_API_KEY` está vacío.");
                return;
              }

              const files = execSync("git ls-files").toString().trim().split("\n");
              let context = "Lista de archivos del repositorio:\n" + files.join("\n") + "\n\n";

              for (const f of files) {
                if (/\.(json|html|js|ts|css|py|md|yml|yaml)$/i.test(f) && !f.includes("package-lock")) {
                  try {
                    const content = fs.readFileSync(f, "utf8").slice(0, 15000);
                    context += `\n--- Archivo: ${f} ---\n${content}\n`;
                  } catch (e) {}
                }
              }

              const systemInstruction = `Eres el ingeniero desarrollador de este repositorio. Responde siempre en español.
          Si el usuario solo hace una pregunta, respóndela normalmente en "reply" y deja "filesToUpdate" como un arreglo vacío [].
          Si el usuario te pide editar, corregir, agregar algo o crear un archivo, devuelve el código COMPLETO y funcional de cada archivo modificado dentro de "filesToUpdate". No omitas partes del archivo ni uses comentarios como "// resto del código aquí".

          Debes responder ÚNICAMENTE con un objeto JSON válido con esta estructura exacta:
          {
            "reply": "Explicación clara en Markdown de la respuesta o de los cambios realizados",
            "commitMessage": "Mensaje corto del commit (si hubo cambios)",
            "filesToUpdate": [
              {
                "path": "nombre_del_archivo.html",
                "content": "contenido completo del archivo"
              }
            ]
          }`;

              const promptText = `${systemInstruction}\n\nInstrucción del usuario: ${process.env.USER_PROMPT}\n\n${context.slice(0, 60000)}`;

              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: promptText }] }],
                  generationConfig: {
                    responseMimeType: "application/json"
                  }
                })
              });

              const data = await res.json();
              if (!res.ok) {
                fs.writeFileSync("respuesta.txt", `⚠️ Error de la API de Gemini (${res.status}):\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``);
                return;
              }

              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
              const result = JSON.parse(rawText);
              let replyMsg = result.reply || "Proceso completado.";

              if (Array.isArray(result.filesToUpdate) && result.filesToUpdate.length > 0) {
                const updatedList = [];
                for (const fileObj of result.filesToUpdate) {
                  if (fileObj.path && typeof fileObj.content === "string") {
                    const dir = path.dirname(fileObj.path);
                    if (dir && dir !== ".") fs.mkdirSync(dir, { recursive: true });
                    fs.writeFileSync(fileObj.path, fileObj.content, "utf8");
                    updatedList.push(fileObj.path);
                  }
                }

                if (updatedList.length > 0) {
                  execSync('git config user.name "github-actions[bot]"');
                  execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
                  for (const p of updatedList) {
                    execSync(`git add "${p}"`);
                  }
                  const status = execSync("git status --porcelain").toString().trim();
                  if (status) {
                    const msg = (result.commitMessage || `Actualización automática desde Issue #${process.env.ISSUE_NUMBER}`).replace(/"/g, "'");
                    execSync(`git commit -m "${msg}"`);
                    execSync("git push");
                    const sha = execSync("git rev-parse --short HEAD").toString().trim();
                    replyMsg += `\n\n---\n✅ **Cambios guardados y publicados en el repositorio** (Commit: \`${sha}\`)\n**Archivos modificados:** ${updatedList.map(f => `\`${f}\``).join(", ")}`;
                  }
                }
              }

              fs.writeFileSync("respuesta.txt", replyMsg);
            } catch (err) {
              fs.writeFileSync("respuesta.txt", `⚠️ Error interno al procesar o editar: ${err.message}`);
            }
          }

          main();
          EOF

          node agente.mjs
          rm -f agente.mjs
          gh issue comment "$ISSUE_NUMBER" --body-file respuesta.txt
