name: Gemini CLI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Analizar repositorio con Gemini y responder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'EOF' > analizar.mjs
          import fs from "fs";
          import { execSync } from "child_process";

          async function main() {
            try {
              const apiKey = (process.env.GEMINI_API_KEY || "").trim();
              if (!apiKey) {
                fs.writeFileSync("respuesta.txt", "⚠️ Error: El secret `GEMINI_API_KEY` está vacío o no se encontró en Settings > Secrets and variables > Actions.");
                return;
              }

              const files = execSync("git ls-files").toString().trim().split("\n");
              let context = "Lista de archivos del repositorio:\n" + files.join("\n") + "\n\n";

              for (const f of files) {
                if (/\.(json|html|js|ts|css|py|md|yml|yaml)$/i.test(f) && !f.includes("package-lock")) {
                  try {
                    const content = fs.readFileSync(f, "utf8").slice(0, 5000);
                    context += `\n--- Archivo: ${f} ---\n${content}\n`;
                  } catch (e) {}
                }
              }

              const promptText = `Eres el asistente técnico del repositorio. Responde en español a la consulta del usuario basándote en los archivos del proyecto.\n\nConsulta: ${process.env.USER_PROMPT}\n\n${context.slice(0, 30000)}`;

              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: promptText }] }]
                })
              });

              const data = await res.json();
              if (!res.ok) {
                fs.writeFileSync("respuesta.txt", `⚠️ Error de la API de Gemini (${res.status}):\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``);
                return;
              }

              const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se generó texto en la respuesta.";
              fs.writeFileSync("respuesta.txt", reply);
            } catch (err) {
              fs.writeFileSync("respuesta.txt", `⚠️ Error interno al ejecutar el script: ${err.message}`);
            }
          }

          main();
          EOF

          node analizar.mjs
          rm -f analizar.mjs
          gh issue comment "$ISSUE_NUMBER" --body-file respuesta.txt
