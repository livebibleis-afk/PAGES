<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackBerry Storm 9530 Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap');

        body {
            background-color: #1a1a24;
            background-image: radial-gradient(circle at center, #2a2a35 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arimo', sans-serif;
        }

        .bb-bezel {
            background: linear-gradient(135deg, #e6e6e6 0%, #999999 20%, #4d4d4d 50%, #999999 80%, #e6e6e6 100%);
            padding: 4px;
            border-radius: 44px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8),
                inset 0 1px 2px rgba(255,255,255,0.8),
                inset 0 -2px 5px rgba(0,0,0,0.5);
        }

        .bb-body {
            width: 340px;
            height: 680px;
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #000;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
        }

        .bb-top {
            width: 100%;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .speaker-grill {
            width: 60px;
            height: 6px;
            background: #000;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }

        .branding {
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .branding-logo {
            display: grid;
            grid-template-columns: repeat(3, 3px);
            gap: 1px;
            transform: rotate(45deg);
        }
        
        .branding-logo span {
            width: 3px;
            height: 3px;
            background: #d4d4d4;
            border-radius: 1px;
        }
        .branding-logo span:nth-child(1), .branding-logo span:nth-child(3), .branding-logo span:nth-child(7), .branding-logo span:nth-child(9) { opacity: 0; }

        .bb-screen-container {
            width: 310px;
            height: 500px;
            background: #000;
            border: 2px solid #222;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,1);
            /* Simulating SurePress screen */
            transition: transform 0.1s;
        }

        .bb-screen-container:active {
            transform: scale(0.995);
        }

        .screen-glare {
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 10;
        }

        .bb-hardware-buttons {
            width: 310px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            background: linear-gradient(180deg, #111 0%, #222 50%, #0a0a0a 100%);
            border-radius: 10px;
            padding: 0 5px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 5px 10px rgba(0,0,0,0.8);
            border-top: 1px solid #333;
            border-bottom: 2px solid #000;
        }

        .hw-btn {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ddd;
            font-size: 18px;
            cursor: pointer;
            position: relative;
            border-right: 1px solid #111;
            box-shadow: inset 1px 0 0 rgba(255,255,255,0.05);
            transition: all 0.1s;
        }
        
        .hw-btn:first-child { border-radius: 10px 0 0 10px; box-shadow: none; }
        .hw-btn:last-child { border-right: none; border-radius: 0 10px 10px 0; }
        
        .hw-btn:active {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.5);
        }

        .btn-call { color: #00ff00; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .btn-end { color: #ff3333; text-shadow: 0 0 5px rgba(255,51,51,0.5); }

        .os-interface {
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png'), linear-gradient(to bottom, #111f38, #000000);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            height: 24px;
            background: linear-gradient(180deg, #222 0%, #000 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }

        .media-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .app-title {
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px #000;
        }

        .album-art-wrapper {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            position: relative;
            background: #111;
            overflow: hidden;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #aaa;
            font-size: 14px;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            border: 1px solid #000;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.2s;
            outline: none;
        }

        .control-btn:active {
            transform: scale(0.9);
            color: #60a5fa;
        }

        .play-btn {
            font-size: 40px;
            width: 60px;
            height: 60px;
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 2px solid #444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="bb-bezel">
        <div class="bb-body">
            
            <div class="bb-top">
                <div class="speaker-grill"></div>
                <div class="branding">
                    <div class="branding-logo">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                    BlackBerry
                </div>
            </div>

            <!-- Screen Area -->
            <div class="bb-screen-container">
                <div class="screen-glare"></div>
                <div class="os-interface">
                    
                    <!-- Status Bar -->
                    <div class="status-bar">
                        <div class="signal">
                            <i class="fas fa-signal"></i> 3G
                        </div>
                        <div class="time" id="clock">12:00 PM</div>
                        <div class="battery">
                            <i class="fas fa-battery-three-quarters"></i>
                        </div>
                    </div>

                    <!-- Media Player App -->
                    <div class="media-app">
                        <div class="app-title">Media Player</div>
                        
                        <div class="album-art-wrapper">
                            <img src="https://placehold.co/200x200/1e293b/ffffff?text=Track+1" alt="Album Art" class="album-art" id="albumArt">
                        </div>

                        <div class="track-info">
                            <div class="track-title" id="trackTitle">Loading...</div>
                            <div class="track-artist" id="trackArtist">Please Wait</div>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar-bg" id="progressBar" onclick="seek(event)">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <div class="time-info">
                                <span id="currentTime">0:00</span>
                                <span id="totalTime">0:00</span>
                            </div>
                        </div>

                        <div class="controls">
                            <button class="control-btn" onclick="prevTrack()" title="Previous">
                                <i class="fas fa-backward-step"></i>
                            </button>
                            <button class="control-btn play-btn" onclick="togglePlay()" id="playBtn" title="Play/Pause">
                                <i class="fas fa-play" style="margin-left: 4px;"></i>
                            </button>
                            <button class="control-btn" onclick="nextTrack()" title="Next">
                                <i class="fas fa-forward-step"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hardware Buttons -->
            <div class="bb-hardware-buttons">
                <div class="hw-btn btn-call" onclick="hwButtonEffect('call')" title="Send">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="hw-btn" onclick="hwButtonEffect('menu')" title="Menu">
                    <i class="fas fa-braille"></i>
                </div>
                <div class="hw-btn" onclick="hwButtonEffect('back')" title="Back">
                    <i class="fas fa-reply"></i>
                </div>
                <div class="hw-btn btn-end" onclick="hwButtonEffect('end')" title="End/Power">
                    <i class="fas fa-phone-slash"></i>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Track Database (Simulated)
        const tracks = [
            {
                title: "Midnight City Lights",
                artist: "Synthwave Sounds",
                art: "https://placehold.co/200x200/4c1d95/ffffff?text=Midnight",
                duration: 215 // 3:35
            },
            {
                title: "Acoustic Breeze",
                artist: "Benjamin Tissot",
                art: "https://placehold.co/200x200/166534/ffffff?text=Acoustic",
                duration: 164 // 2:44
            },
            {
                title: "Retro Gaming Vibes",
                artist: "8-Bit Hero",
                art: "https://placehold.co/200x200/991b1b/ffffff?text=Retro",
                duration: 180 // 3:00
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentProgress = 0; // in seconds
        let playInterval;

        // DOM Elements
        const albumArt = document.getElementById('albumArt');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playBtn = document.getElementById('playBtn');
        const clockEl = document.getElementById('clock');
        const progressBar = document.getElementById('progressBar');

        function loadTrack(index) {
            const track = tracks[index];
            albumArt.style.opacity = 0; // fade effect
            
            setTimeout(() => {
                albumArt.src = track.art;
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
                totalTimeEl.textContent = formatTime(track.duration);
                albumArt.style.opacity = 1;
            }, 300);

            currentProgress = 0;
            updateProgressUI();
            
            if (isPlaying) {
                clearInterval(playInterval);
                startSimulation();
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateProgressUI() {
            const track = tracks[currentTrackIndex];
            const percent = (currentProgress / track.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(currentProgress);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startSimulation();
            } else {
                playBtn.innerHTML = '<i class="fas fa-play" style="margin-left: 4px;"></i>';
                clearInterval(playInterval);
            }
        }

        function startSimulation() {
            clearInterval(playInterval);
            playInterval = setInterval(() => {
                const track = tracks[currentTrackIndex];
                currentProgress += 1; // 1 second per second
                
                if (currentProgress >= track.duration) {
                    nextTrack();
                } else {
                    updateProgressUI();
                }
            }, 1000);
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
        }

        function prevTrack() {
            if (currentProgress > 3) {
                // If more than 3 seconds in, restart track
                currentProgress = 0;
                updateProgressUI();
            } else {
                // Otherwise go to previous
                currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
                loadTrack(currentTrackIndex);
            }
        }

        function seek(e) {
            const track = tracks[currentTrackIndex];
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            
            currentProgress = percent * track.duration;
            updateProgressUI();
        }

        function hwButtonEffect(type) {
            // Visual feedback handled by CSS active state.
            // Add logical feedback based on button
            if (type === 'end') {
                if (isPlaying) togglePlay();
            } else if (type === 'menu') {
                // Show a quick simulated toast message on screen
                const toast = document.createElement('div');
                toast.textContent = "Menu Pressed";
                toast.style.position = 'absolute';
                toast.style.bottom = '20px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.background = 'rgba(0,0,0,0.8)';
                toast.style.color = 'white';
                toast.style.padding = '5px 15px';
                toast.style.borderRadius = '15px';
                toast.style.fontSize = '12px';
                toast.style.zIndex = '100';
                
                document.querySelector('.os-interface').appendChild(toast);
                setTimeout(() => toast.remove(), 1500);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            clockEl.textContent = `${hours}:${minutes} ${ampm}`;
        }

        // Init
        window.onload = () => {
            loadTrack(0);
            updateClock();
            setInterval(updateClock, 10000); // update clock every 10s
        };
    </script>
</body>
</html>
