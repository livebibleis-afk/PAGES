<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Código · Terminal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #161b22;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }
  header span {
    font-size: 12px;
    color: #8b949e;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
    scroll-behavior: smooth;
  }
  .line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #7ee787; }
  .user { color: #79c0ff; }
  .error { color: #f85149; }
  .success { color: #7ee787; }
  .info { color: #d2a8ff; }
  .verse { color: #ffa657; }
  .ref { color: #79c0ff; font-weight: bold; }
  #input-area {
    display: flex;
    background: #0d1117;
    border-top: 1px solid #30363d;
    padding: 12px 16px;
    align-items: center;
  }
  #prompt-symbol {
    color: #7ee787;
    margin-right: 8px;
    user-select: none;
    font-weight: bold;
  }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
</style>
</head>
<body>
<header>
  <h1>📜 Biblia Código</h1>
  <span>Terminal Offline · RVR 1909</span>
</header>
<div id="output"></div>
<div id="input-area">
  <span id="prompt-symbol">biblia></span>
  <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Escribe un comando (ej. help, books, GET Juan 3:16)...">
</div>

<script>
const output = document.getElementById('output');
const cmdInput = document.getElementById('cmd');
let commandHistory = [];
let historyIndex = -1;

// Base de datos interna autónoma (RVR 1909 incorporada)
const bibleData = {
  books: [
    {
      name: "Génesis",
      chapters: [
        { 
          number: 1, 
          verses: [
            { number: 1, text: "En el principio creó Dios los cielos y la tierra." },
            { number: 27, text: "Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó." }
          ] 
        }
      ]
    },
    {
      name: "Juan",
      chapters: [
        { 
          number: 1, 
          verses: [
            { number: 1, text: "En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios." }
          ] 
        },
        { 
          number: 3, 
          verses: [
            { number: 16, text: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna." }
          ] 
        }
      ]
    },
    {
      name: "Salmos",
      chapters: [
        { 
          number: 23, 
          verses: [
            { number: 1, text: "Jehová es mi pastor; nada me faltará." },
            { number: 2, text: "En lugares de delicados pastos me hará descansar; junto a aguas de reposo me pastoreará." }
          ] 
        }
      ]
    },
    {
      name: "Proverbios",
      chapters: [
        { 
          number: 3, 
          verses: [
            { number: 5, text: "Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia." },
            { number: 6, text: "Reconócelo en todos tus caminos, y él enderezará tus veredas." }
          ] 
        }
      ]
    }
  ]
};

const books = bibleData.books.map(b => b.name);

function addLine(text, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function addHTML(html, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.innerHTML = html;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function findVerse(bookName, chapter, verse) {
  const cleanQuery = bookName.trim().toLowerCase();
  const book = bibleData.books.find(b => 
    b.name.toLowerCase() === cleanQuery ||
    b.name.toLowerCase().includes(cleanQuery)
  );
  if (!book) return null;
  const ch = book.chapters.find(c => c.number === chapter);
  if (!ch) return null;
  const v = ch.verses.find(vr => vr.number === verse);
  return v ? { bookName: book.name, text: v.text } : null;
}

function parseAndExecute(input) {
  const trimmed = input.trim();
  if (!trimmed) return;

  addLine('biblia> ' + trimmed, 'user');
  commandHistory.push(trimmed);
  historyIndex = commandHistory.length;

  const lower = trimmed.toLowerCase();

  if (['help', 'ayuda', '?'].includes(lower)) {
    showHelp();
    return;
  }

  if (['books', 'libros'].includes(lower)) {
    addLine('Libros disponibles en este módulo:', 'info');
    addLine(books.join(', '), 'success');
    return;
  }

  let match = trimmed.match(/^verse\s*\(\s*["']?([^"']+)["']?\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  match = trimmed.match(/^GET\s+(.+?)\s+(\d+):(\d+)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  match = trimmed.match(/^print\s+(.+?)\.(\d+)\.(\d+)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  addLine(`SyntaxError: Comando o sintaxis no reconocida: "${trimmed}"`, 'error');
  addLine('Escribe "help" para ver las opciones válidas.', 'info');
}

function executeVerseQuery(book, ch, v) {
  const result = findVerse(book, ch, v);
  if (result) {
    addHTML(`<span class="ref">${result.bookName} ${ch}:${v}</span><br><span class="verse">${result.text}</span>`, 'success');
  } else {
    addLine(`Error: Referencia no encontrada (${book} ${ch}:${v})`, 'error');
  }
}

function showHelp() {
  addLine('=== Guía de Comandos · Biblia Código ===', 'info');
  addLine('Sintaxis permitidas:', 'info');
  addLine('  • verse("Juan", 3, 16)', 'success');
  addLine('  • GET Salmos 23:1', 'success');
  addLine('  • print Proverbios.3.5', 'success');
  addLine('Comandos generales:', 'info');
  addLine('  • books  - Muestra la lista de libros', 'success');
  addLine('  • help   - Muestra esta ayuda', 'success');
}

cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = cmdInput.value;
    cmdInput.value = '';
    parseAndExecute(val);
  } else if (e.key === 'ArrowUp') {
    if (historyIndex > 0) {
      historyIndex--;
      cmdInput.value = commandHistory[historyIndex];
    }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      cmdInput.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      cmdInput.value = '';
    }
    e.preventDefault();
  }
});

document.addEventListener('click', () => cmdInput.focus());

// Inicio de la terminal
addLine('Bienvenido a Biblia Código (Modo Autónomo)', 'info');
addLine('Sistema cargado sin dependencias externas. Listo para usar.', 'success');
addLine('');
showHelp();
</script>
</body>
</html>
