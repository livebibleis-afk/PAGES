<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Código · Terminal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #161b22;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }
  header span {
    font-size: 12px;
    color: #8b949e;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
    scroll-behavior: smooth;
  }
  .line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #7ee787; }
  .user { color: #79c0ff; }
  .error { color: #f85149; }
  .success { color: #7ee787; }
  .info { color: #d2a8ff; }
  .verse { color: #ffa657; }
  .ref { color: #79c0ff; font-weight: bold; }
  #input-area {
    display: flex;
    background: #0d1117;
    border-top: 1px solid #30363d;
    padding: 12px 16px;
    align-items: center;
  }
  #prompt-symbol {
    color: #7ee787;
    margin-right: 8px;
    user-select: none;
    font-weight: bold;
  }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
</style>
</head>
<body>
<header>
  <h1>📜 Biblia Código</h1>
  <span>Terminal · Consulta la Biblia (RVR 1909) mediante comandos</span>
</header>
<div id="output"></div>
<div id="input-area">
  <span id="prompt-symbol">biblia></span>
  <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Escribe un comando (ej. help, books, GET Juan 3:16)...">
</div>

<script>
const output = document.getElementById('output');
const cmdInput = document.getElementById('cmd');
let bibleData = null;
let books = [];
let commandHistory = [];
let historyIndex = -1;

function addLine(text, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function addHTML(html, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.innerHTML = html;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

async function loadBible() {
  addLine('Cargando base de datos (RVR 1909)...', 'info');
  try {
    const res = await fetch('https://raw.githubusercontent.com/livebibleis-afk/biblia-viviente/main/data/rvr1909.json');
    if (!res.ok) throw new Error('No se pudo conectar al repositorio remoto');
    bibleData = await res.json();
    books = extractBooks(bibleData);
    addLine(`✓ Biblia cargada con éxito. ${books.length} libros disponibles.`, 'success');
    showHelp();
  } catch (e) {
    addLine('Aviso: Conexión remota fallida. Activando modo demo offline.', 'error');
    bibleData = getSample();
    books = extractBooks(bibleData);
    showHelp();
  }
}

function extractBooks(data) {
  if (data && data.books && Array.isArray(data.books)) {
    return data.books.map(b => b.name);
  }
  return [];
}

function getSample() {
  return {
    books: [
      {
        name: "Juan",
        chapters: [
          { number: 1, verses: [{number:1, text:"En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."}] },
          { number: 3, verses: [{number:16, text:"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."}] }
        ]
      },
      {
        name: "Génesis",
        chapters: [
          { number: 1, verses: [{number:1, text:"En el principio creó Dios los cielos y la tierra."}] }
        ]
      }
    ]
  };
}

function findVerse(bookName, chapter, verse) {
  if (!bibleData || !bibleData.books) return null;
  const cleanQuery = bookName.trim().toLowerCase();
  const book = bibleData.books.find(b => 
    b.name.toLowerCase() === cleanQuery ||
    b.name.toLowerCase().includes(cleanQuery)
  );
  if (!book) return null;
  const ch = book.chapters.find(c => c.number === chapter);
  if (!ch) return null;
  const v = ch.verses.find(vr => vr.number === verse);
  return v ? { bookName: book.name, text: v.text } : null;
}

function parseAndExecute(input) {
  const trimmed = input.trim();
  if (!trimmed) return;

  addLine('biblia> ' + trimmed, 'user');
  commandHistory.push(trimmed);
  historyIndex = commandHistory.length;

  const lower = trimmed.toLowerCase();

  if (['help', 'ayuda', '?'].includes(lower)) {
    showHelp();
    return;
  }

  if (['books', 'libros'].includes(lower)) {
    addLine('Libros disponibles:', 'info');
    addLine(books.join(', '), 'success');
    return;
  }

  let match = trimmed.match(/^verse\s*\(\s*["']?([^"']+)["']?\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  match = trimmed.match(/^GET\s+(.+?)\s+(\d+):(\d+)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  match = trimmed.match(/^print\s+(.+?)\.(\d+)\.(\d+)$/i);
  if (match) {
    executeVerseQuery(match[1], parseInt(match[2]), parseInt(match[3]));
    return;
  }

  addLine(`SyntaxError: Comando o sintaxis no reconocida: "${trimmed}"`, 'error');
  addLine('Escribe "help" para ver las opciones válidas.', 'info');
}

function executeVerseQuery(book, ch, v) {
  const result = findVerse(book, ch, v);
  if (result) {
    addHTML(`<span class="ref">${result.bookName} ${ch}:${v}</span><br><span class="verse">${result.text}</span>`, 'success');
  } else {
    addLine(`Error: Referencia no encontrada (${book} ${ch}:${v})`, 'error');
  }
}

function showHelp() {
  addLine('=== Guía de Comandos · Biblia Código ===', 'info');
  addLine('Sintaxis permitidas para consultas:', 'info');
  addLine('  • verse("Juan", 3, 16)', 'success');
  addLine('  • GET Génesis 1:1', 'success');
  addLine('  • print Juan.3.16', 'success');
  addLine('Comandos generales:', 'info');
  addLine('  • books  - Muestra la lista completa de libros', 'success');
  addLine('  • help   - Muestra esta ayuda', 'success');
}

cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = cmdInput.value;
    cmdInput.value = '';
    parseAndExecute(val);
  } else if (e.key === 'ArrowUp') {
    if (historyIndex > 0) {
      historyIndex--;
      cmdInput.value = commandHistory[historyIndex];
    }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      cmdInput.value = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      cmdInput.value = '';
    }
    e.preventDefault();
  }
});

// Mantener el foco activo siempre en el input de la terminal
document.addEventListener('click', () => cmdInput.focus());

addLine('Bienvenido a Biblia Código', 'info');
addLine('Terminal interactiva lista.', 'info');
addLine('');
loadBible();
</script>
</body>
</html>
