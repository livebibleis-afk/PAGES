<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Código · Terminal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #161b22;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }
  header span {
    font-size: 12px;
    color: #8b949e;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #7ee787; }
  .user { color: #79c0ff; }
  .error { color: #f85149; }
  .success { color: #7ee787; }
  .info { color: #d2a8ff; }
  .verse { color: #ffa657; }
  .ref { color: #79c0ff; font-weight: bold; }
  #input-area {
    display: flex;
    background: #0d1117;
    border-top: 1px solid #30363d;
    padding: 12px 16px;
  }
  #prompt-symbol {
    color: #7ee787;
    margin-right: 8px;
    user-select: none;
  }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .welcome { color: #8b949e; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>📜 Biblia Código</h1>
  <span>Terminal · Escribe código para consultar la Biblia (RVR 1909)</span>
</header>
<div id="output"></div>
<div id="input-area">
  <span id="prompt-symbol">biblia></span>
  <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Escribe un comando...">
</div>

<script>
const output = document.getElementById('output');
const cmdInput = document.getElementById('cmd');
let bibleData = null;
let books = [];

function addLine(text, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function addHTML(html, className = '') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.innerHTML = html;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

async function loadBible() {
  addLine('Cargando Biblia (RVR 1909)...', 'info');
  try {
    const res = await fetch('https://raw.githubusercontent.com/livebibleis-afk/biblia-viviente/main/data/rvr1909.json');
    if (!res.ok) throw new Error('No se pudo cargar');
    bibleData = await res.json();
    books = extractBooks(bibleData);
    addLine('✓ Biblia cargada. ' + books.length + ' libros disponibles.', 'success');
    showHelp();
  } catch (e) {
    addLine('Error al cargar la Biblia: ' + e.message, 'error');
    addLine('Usando modo demo con datos limitados.', 'info');
    bibleData = getSample();
    books = extractBooks(bibleData);
    showHelp();
  }
}

function extractBooks(data) {
  if (data && data.books && Array.isArray(data.books)) {
    return data.books.map(b => b.name);
  }
  return [];
}

function getSample() {
  return {
    books: [
      {
        name: "Juan",
        chapters: [
          { number: 1, verses: [{number:1, text:"En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."}] },
          { number: 3, verses: [{number:16, text:"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."}] }
        ]
      },
      {
        name: "Génesis",
        chapters: [
          { number: 1, verses: [{number:1, text:"En el principio creó Dios los cielos y la tierra."}] }
        ]
      }
    ]
  };
}

function findVerse(bookName, chapter, verse) {
  if (!bibleData || !bibleData.books) return null;
  const book = bibleData.books.find(b => 
    b.name.toLowerCase().includes(bookName.toLowerCase()) ||
    b.name.toLowerCase() === bookName.toLowerCase()
  );
  if (!book) return null;
  const ch = book.chapters.find(c => c.number === chapter);
  if (!ch) return null;
  const v = ch.verses.find(vr => vr.number === verse);
  return v ? v.text : null;
}

function parseAndExecute(input) {
  const trimmed = input.trim();
  if (!trimmed) return;

  addLine('biblia> ' + trimmed, 'user');

  const lower = trimmed.toLowerCase();

  if (lower === 'help' || lower === 'ayuda' || lower === '?') {
    showHelp();
    return;
  }

  if (lower === 'books' || lower === 'libros') {
    addLine('Libros disponibles:', 'info');
    addLine(books.slice(0, 20).join(', ') + (books.length > 20 ? '...' : ''), 'success');
    return;
  }

  let match = trimmed.match(/^verse\s*\(\s*["']?([^"']+)["']?\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
  if (match) {
    const [, book, ch, v] = match;
    const text = findVerse(book.trim(), parseInt(ch), parseInt(v));
    if (text) {
      addHTML(`<span class="ref">${book.trim()} ${ch}:${v}</span><br><span class="verse">${text}</span>`, 'success');
    } else {
      addLine(`Error: Versículo no encontrado (${book} ${ch}:${v})`, 'error');
    }
    return;
  }

  match = trimmed.match(/^GET\s+(.+?)\s+(\d+):(\d+)$/i);
  if (match) {
    const [, book, ch, v] = match;
    const text = findVerse(book.trim(), parseInt(ch), parseInt(v));
    if (text) {
      addHTML(`<span class="ref">${book.trim()} ${ch}:${v}</span><br><span class="verse">${text}</span>`, 'success');
    } else {
      addLine(`Error: Versículo no encontrado (${book} ${ch}:${v})`, 'error');
    }
    return;
  }

  match = trimmed.match(/^print\s+(.+?)\.(\d+)\.(\d+)$/i);
  if (match) {
    const [, book, ch, v] = match;
    const text = findVerse(book.trim(), parseInt(ch), parseInt(v));
    if (text) {
      addHTML(`<span class="ref">${book.trim()} ${ch}:${v}</span><br><span class="verse">${text}</span>`, 'success');
    } else {
      addLine(`Error: Versículo no encontrado (${book} ${ch}:${v})`, 'error');
    }
    return;
  }

  addLine('SyntaxError: Comando no reconocido. Escribe "help" para ver la sintaxis válida.', 'error');
  addLine('El terminal solo responde a código válido.', 'info');
}

function showHelp() {
  addLine('=== Biblia Código — Sintaxis ===', 'info');
  addLine('El terminal solo responde si escribes la sintaxis correcta:', 'info');
  addLine('');
  addLine('verse("Juan", 3, 16)', 'success');
  addLine('GET Juan 3:16', 'success');
  addLine('print Juan.3.16', 'success');
  addLine('help', 'success');
  addLine('books', 'success');
  addLine('');
  addLine('Si la sintaxis es incorrecta → SyntaxError', 'error');
  addLine('Datos: Reina-Valera 1909 (dominio público)', 'info');
}

cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = cmdInput.value;
    cmdInput.value = '';
    parseAndExecute(val);
  }
});

addLine('Bienvenido a Biblia Código', 'info');
addLine('Un terminal donde la Biblia se consulta como código.', 'info');
addLine('Si no escribes bien la sintaxis, el terminal da error.', 'info');
addLine('');
loadBible();
</script>
</body>
</html>
